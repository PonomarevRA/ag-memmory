kind: decision
area: web-ui
status: approved
title: Expose the local AgMemory scope to Codex through stdio MCP
summary: Codex invokes a local stdio MCP host with an environment-fixed store, actor, and exact scope.
recorded: "2026-08-09"
updated: "2026-08-09"
tags: [web-ui, codex, mcp, memory, development]
sources:
  - kind: code
    ref: src/AgMemory.McpServer/Program.cs
  - kind: code
    ref: src/AgMemory.McpServer/LocalAgMemoryMcpRuntime.cs
  - kind: code
    ref: src/AgMemory.McpServer/AgMemoryTools.cs
  - kind: test
    ref: tests/AgMemory.McpServer.Tests/LocalAgMemoryMcpRuntimeTests.cs
payload:
  problem: Codex could use project documentation but could not query or persist records in the local AgMemory store used by the Yuki chat.
  decision: Provide a separate local stdio MCP host with memory_recall, memory_remember, and memory_status tools, then register it in the local Codex configuration.
  rationale: A process environment supplies the storage path, actor, and all exact-scope dimensions once at startup; tool calls never receive those authority values or durable IDs.
  consequences:
    - Codex can test the same local LanceDB scope as the Yuki chat without running a network listener.
    - Recall returns active, non-expired lexical matches only; remember uses the normal command service and local embedding fallback.
    - This is development-only local authority. Production requires authenticated identity-to-scope mapping and a non-local configuration path.
